{{- $data := dict
  "MqttSecret" "mosquitto-persistence-secret"
  "Secret" (list
    (dict
      "Name" "database-secret"
      "Env" (list
        (dict
          "Name" "DB_HOST"
          "Value" "database"
        )
        (dict
          "Name" "DB_SCHEMA"
          "Key" "schema"
        )
        (dict
          "Name" "DB_USER"
          "Key" "username"
        )
        (dict
          "Name" "DB_SECRET_FILE"
          "SubPath" "password"
        )
      )
    )
  )
  "Ports" (list (dict
    "Name" "http"
    "Port" 8080
  ))
  "Probe" (dict
    "Http" "/health"
    "ReadinessInitialDelay" 10
    "LivenessInitialDelay" 20
  )
}}
{{- include "powerpi.deployment" (merge (dict "Params" $data) . )}}
